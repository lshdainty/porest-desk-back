spring:
  config:
    import: optional:file:.env.${SPRING_PROFILES_ACTIVE:local}[.properties]
  application:
    name: porest-desk
  messages:
    # 앞에 적은 번들이 이긴다(ResourceBundleMessageSource 는 basename 을 순서대로 훑다
    # 처음 찾은 값을 쓴다). desk 가 앞이라야 core 번들의 같은 키를 덮을 수 있다 —
    # 뒤에 두면 error.common.invalid.input 처럼 겹치는 키가 core 값으로 나가고,
    # 이 레포의 messages_ko 를 아무리 고쳐도 화면은 그대로다(QA 2026-09-03 #74 실측).
    basename: message/messages,message/core-messages
    encoding: utf-8

  # 파일 업로드 (데이터 가져오기 등) — 기본 1MB 제한을 넘겨 CSV/Excel 업로드 허용
  servlet:
    multipart:
      max-file-size: ${MULTIPART_MAX_FILE_SIZE:10MB}
      max-request-size: ${MULTIPART_MAX_REQUEST_SIZE:12MB}

  # DB 설정
  datasource:
    driver-class-name: org.mariadb.jdbc.Driver
    url: ${DB_URL}
    username: ${DB_USERNAME}
    password: ${DB_PASSWORD}
    hikari:
      maximum-pool-size: ${HIKARI_MAX_POOL_SIZE:10}
      minimum-idle: ${HIKARI_MIN_IDLE:5}
      connection-timeout: ${HIKARI_CONNECTION_TIMEOUT:30000}
      idle-timeout: ${HIKARI_IDLE_TIMEOUT:600000}
      max-lifetime: ${HIKARI_MAX_LIFETIME:1800000}
      leak-detection-threshold: ${HIKARI_LEAK_DETECTION:60000}

  # JPA 설정
  jpa:
    hibernate:
      ddl-auto: none
    properties:
      hibernate:
        dialect: org.hibernate.dialect.MariaDBDialect
        default_batch_fetch_size: 100
        format_sql: true
    open-in-view: false

  # Redis 설정
  data:
    redis:
      host: ${REDIS_HOST}
      port: ${REDIS_PORT}
      password: ${REDIS_PASSWORD}
      # 기본값을 두지 않는다. 값이 빠지면 기동에서 죽는 게 맞다 — 조용히 다른 DB 로 뜨면
      # 증권사 토큰 캐시가 통째로 안 보이고, 사용자마다 토큰을 새로 발급받는다.
      # 나무는 발급마다 알림톡을 보내므로 사용자에게 문자가 쏟아지는데 기동은 정상이라 아무도 모른다.
      # sso·hr 도 같은 이유로 기본값이 없다(sso=0, hr=1, desk=2).
      database: ${REDIS_DATABASE}

  # Graceful Shutdown
  lifecycle:
    timeout-per-shutdown-phase: ${SHUTDOWN_TIMEOUT:30s}

# 서버 설정
server:
  port: ${SERVER_PORT:8002}
  shutdown: ${SERVER_SHUTDOWN:graceful}
  forward-headers-strategy: framework
  # 에러 응답 노출 제어 (server.error.*). 각 값 의미는 .env.example 참고
  error:
    include-stacktrace: ${ERROR_STACKTRACE:never}
    include-message: ${ERROR_MESSAGE:never}
    include-exception: ${ERROR_EXCEPTION:false}
    include-binding-errors: ${ERROR_BINDING:never}

# 로깅 설정
logging:
  level:
    com.porest.desk: ${LOG_LEVEL:info}
    org.hibernate.SQL: ${LOG_LEVEL_HIBERNATE:info}
    org.hibernate.type.descriptor.sql.BasicBinder: ${LOG_LEVEL_HIBERNATE_BINDER:info}
    p6spy: ${LOG_LEVEL_P6SPY:info}
    root: ${LOG_LEVEL_ROOT:info}

# p6spy SQL 로깅 — 기본은 꺼짐이다.
#
# p6spy 는 `?` 자리에 바인딩 값을 끼워 넣은 **완성 SQL** 을 한 줄 더 남긴다. 켜 두면
# user_securities_credential 의 api_key_enc·api_secret_enc, 암호화된 SSO refresh token,
# 이메일, 계좌 식별자가 INSERT/UPDATE 문에 통째로 찍힌다.
#
# **RequestResponseLoggingFilter 의 마스킹은 여기에 닿지 않는다.** core 마스커가 보는 건
# JSON 의 `"키":값` 과 쿼리스트링의 `키=값` 인데, SQL 의 INSERT 는 값이 자리로만 온다
# (`insert into t (a,b) values ('...','...')`) — 값 옆에 컬럼명이 없어 무엇을 가릴지 알 수 없다.
# 그래서 이건 마스킹으로 못 막고 끄는 것으로 막는다.
#
# 쿼리 **모양**만 보면 될 때는 이걸 켜지 말고 LOG_LEVEL_HIBERNATE=debug 를 써라 — `?` 가
# 그대로 남는다. 값까지 봐야 하는 디버깅은 로컬에서만 P6SPY_LOG_SQL_VALUES=true 로 켠다.
#
# 이름이 P6SPY_ENABLED 에서 바뀐 이유 — 예전 설정은 `spring.datasource.p6spy` 아래에 있었고
# 그 prefix 를 읽는 @ConfigurationProperties 가 없다(라이브러리는 `decorator.datasource` 를
# 읽는다). 그래서 P6SPY_ENABLED 는 어떤 값이어도 효과가 없었고 p6spy 는 라이브러리 기본값
# true 로 돌고 있었다. 자리만 고치고 이름을 그대로 뒀다면, 서버 .env 에 남아 있는
# P6SPY_ENABLED=true 가 이 커밋부터 **진짜로** 켜진다 — 그래서 이름을 갈았다.
decorator:
  datasource:
    p6spy:
      enable-logging: ${P6SPY_LOG_SQL_VALUES:false}
      multiline: true
      logging: slf4j

# JWT 설정
jwt:
  secret: ${JWT_SECRET}
  access-token-expiration: ${JWT_ACCESS_EXPIRATION:3600000}
  # 세션 수명 — access 가 만료돼도 이 기간 안이면 조용히 재발급된다. SSO refresh 수명(7일)과 맞춘다.
  # access token 쿠키의 maxAge 도 이 값을 쓴다(쿠키가 먼저 사라지면 재발급할 세션을 못 찾는다).
  session-expiration: ${JWT_SESSION_EXPIRATION:604800000}
  # SSO RS256 토큰 검증용 JWKS (기본값은 SSO_API_URL 에서 파생)
  sso-jwks-uri: ${SSO_JWKS_URI:${SSO_API_URL}/.well-known/jwks.json}

# 어플리케이션 정보
app:
  sso:
    base-url: ${SSO_API_URL}
    # client_credentials 그랜트용 desk 클라이언트 시크릿 (desk→SSO 서비스 토큰 발급)
    client-secret: ${SSO_CLIENT_SECRET:}
  cors:
    allowed-origins: ${CORS_ORIGINS}
  # 기동 시 스키마 검증. ddl-auto 가 none 이라 엔티티와 스키마가 어긋나도 기동은 성공하고 첫 쿼리에서
  # 터진다(dev 2026-08-24: 기동 2시간 37분 뒤 대시보드 열자 Unknown column 3461건). 엔티티 매핑이
  # 기대하는 테이블·컬럼이 실재하는지 확인해 없으면 기동을 막는다.
  # **끄지 마라** — 꺼진 순간 "기동 성공 = 스키마 일치" 가 다시 성립하지 않는다.
  schema-check:
    enabled: ${SCHEMA_CHECK_ENABLED:true}
  # 비밀값 공용 암호화 키 — 증권사 크리덴셜·SSO refresh token(DB) + 증권사 액세스 토큰 캐시(Redis).
  # Base64 32바이트, env 로만 주입.
  # 미설정이면 로그인은 되지만 SSO 세션이 저장되지 않아 무음 재인증만 조용히 꺼진다.
  security:
    encryption-key: ${APP_ENCRYPTION_KEY:}
  # 로그아웃한 세션의 폐기 표식 저장 위치: redis(기본) | memory
  # desk access token 은 무상태 JWT 라 로그아웃해도 만료까지 통한다. 이 표식을 필터가 확인해
  # 즉시 막는다. 인스턴스가 여럿이면 반드시 redis 다 — memory 로 두면 로그아웃을 받은
  # 인스턴스만 알고 나머지는 그 토큰을 계속 통과시켜, 로그아웃이 "가끔 먹는" 기능이 된다.
  # 테스트만 memory 로 내린다(Redis 를 띄우지 않는다).
  session-revocation:
    store: ${SESSION_REVOCATION_STORE:redis}
  # 증권사 연동 공통. 인증정보는 서버 공용 키가 아니라 사용자가 등록한 본인 키(암호화 저장)를 쓴다.
  securities:
    # 액세스 토큰 캐시 위치: redis(기본) | memory
    # 나무는 토큰 수명이 24시간이고 재발급이 사용자 보안 알림으로 쌓인다. memory 로 두면 재시작·
    # 인스턴스마다 전원 재발급이 나가므로 운영에서는 redis 를 그대로 둔다.
    token-store: ${SECURITIES_TOKEN_STORE:redis}
  # 토스증권 Open API 연동 (조회 프록시). base-url·타임아웃만 둔다.
  toss:
    base-url: ${TOSS_API_URL:https://openapi.tossinvest.com}
    connect-timeout: ${TOSS_CONNECT_TIMEOUT:5000}
    read-timeout: ${TOSS_READ_TIMEOUT:10000}
  # 나무증권(NH PLUG) Open API 연동.
  namu:
    # 연동 환경 — LIVE(운영) | MOCK(모의투자). 도메인과 유효 계좌구분(acct_type)을 함께 결정하는
    # 단일 출처다. 나무는 계좌구분이 그 계좌를 쓸 수 있는 도메인을 정하므로(01·02 운영 / 03 모의투자)
    # 둘을 따로 설정하면 한쪽만 바꾼 순간 잔고 조회가 계좌번호 오류로 조용히 터진다.
    # 개발은 MOCK, 운영은 LIVE(기본값).
    environment: ${NAMU_ENVIRONMENT:LIVE}
    # 조회 base URL 오버라이드. 비우면 environment 의 기본 도메인(포트 8443 포함)을 쓴다.
    # 환경과 어긋난 나무 도메인을 넣으면 기동이 막힌다. 평소엔 비워 두고 environment 만 바꾼다.
    base-url: ${NAMU_API_URL:}
    # 토큰 발급 전용 — 모의투자는 발급을 제공하지 않아 환경과 무관하게 항상 운영이다.
    # 발급받은 토큰은 운영·모의투자 호출에 그대로 쓴다. 일부러 env 로 뚫지 않았다.
    auth-base-url: https://api.nhplug.com:8443
    connect-timeout: ${NAMU_CONNECT_TIMEOUT:5000}
    read-timeout: ${NAMU_READ_TIMEOUT:10000}
    # 나무엔 종목 다건 시세 API 가 없어 종목마다 1콜이 나간다. 자산 화면은 10초마다 폴링하므로
    # 캐시가 없으면 한 사용자가 초당 몇 콜씩 지속적으로 내 유량 제한(429)에 걸린다.
    quote-cache-ttl-seconds: ${NAMU_QUOTE_CACHE_TTL:20}
    # 직렬 호출이라 종목이 많고 업스트림이 느리면 요청 하나가 스레드를 분 단위로 물고 있는다.
    # 예산을 넘기면 받은 것만 돌려주고 나머지는 다음 조회로 미룬다.
    price-batch-budget-ms: ${NAMU_PRICE_BATCH_BUDGET_MS:4000}
    # 환율 캐시 (초). 시세(20초)보다 훨씬 길다 — 나무가 주는 환율은 그날의 기준환율이라
    # 장중에 초 단위로 움직이지 않는다. 반면 한 번 물으면 계좌목록+잔고(+폴백 시 현재가)로
    # 최대 3콜이 100ms 안에 몰려 나가 유량 제한(429)을 건드린다.
    fx-cache-ttl-seconds: ${NAMU_FX_CACHE_TTL:600}
    # 환율을 못 구했을 때의 캐시 (초). 실패를 안 담으면 환율이 안 나오는 사용자가 매 요청마다
    # 3콜을 다시 낸다 — 그게 429 를 부른 모양이다. 복구가 늦지 않게 성공보다 짧게 둔다.
    fx-failure-cache-ttl-seconds: ${NAMU_FX_FAILURE_CACHE_TTL:60}
    # 429 를 맞은 뒤의 백오프 (초). 429 는 "지금 너무 많이 부르고 있다" 라 일반 실패와 뜻이
    # 다르다 — 곧바로 다시 치면 원인을 재현한다. dev 에서 429 가 2~3분 간격으로 반복돼
    # 그보다는 길게, 상류가 풀리면 곧 따라잡게 성공 캐시보다는 짧게 잡았다.
    fx-rate-limit-backoff-seconds: ${NAMU_FX_RATE_LIMIT_BACKOFF:300}
  # 대한민국 공휴일 자동 동기화. 1차 소스는 한국천문연구원 특일정보 API, 실패 시 월력요항 기반 정적 소스로 폴백.
  holiday:
    kasi:
      base-url: ${KASI_API_URL:https://apis.data.go.kr/B090041/openapi/service/SpcdeInfoService}
      # 공공데이터포털 인증키(디코딩 키). 미설정 시 KASI 호출을 건너뛰고 폴백 소스만 사용한다.
      service-key: ${KASI_SERVICE_KEY:}
      connect-timeout: ${KASI_CONNECT_TIMEOUT:5000}
      read-timeout: ${KASI_READ_TIMEOUT:10000}
    fallback:
      enabled: ${HOLIDAY_FALLBACK_ENABLED:true}
      base-url: ${HOLIDAY_FALLBACK_URL:https://holidays.hyunbin.page}
      connect-timeout: ${HOLIDAY_FALLBACK_CONNECT_TIMEOUT:5000}
      read-timeout: ${HOLIDAY_FALLBACK_READ_TIMEOUT:10000}
    sync:
      enabled: ${HOLIDAY_SYNC_ENABLED:true}
      cron: ${HOLIDAY_SYNC_CRON:0 0 12 * * *}
      lookahead-years: ${HOLIDAY_SYNC_LOOKAHEAD_YEARS:1}
    backfill:
      # 초기 적재용. 한 번 돌린 뒤 다시 false 로 내린다.
      enabled: ${HOLIDAY_BACKFILL_ENABLED:false}
      start-year: ${HOLIDAY_BACKFILL_START_YEAR:2004}
  # 한국투자증권 종목 마스터파일 동기화. 인증 없는 공개 다운로드라 API 키가 필요 없다.
  stock:
    master:
      # 소스별 다운로드 base URL. 소스가 늘면 여기 한 줄만 더한다.
      base-url:
        KIS: ${KIS_MASTER_BASE_URL:https://new.real.download.dws.co.kr/common/master}
        NH: ${NH_MASTER_BASE_URL:https://www.nhplug.com/instruments}
      connect-timeout: ${KIS_MASTER_CONNECT_TIMEOUT:5000}
      read-timeout: ${KIS_MASTER_READ_TIMEOUT:30000}
      sync:
        enabled: ${KIS_MASTER_SYNC_ENABLED:true}
        cron: ${KIS_MASTER_SYNC_CRON:0 0 7 * * *}
      backfill:
        # 기동 시 테이블이 비어 있으면 1회 적재. 이미 데이터가 있으면 아무것도 하지 않는다.
        enabled: ${KIS_MASTER_BACKFILL_ENABLED:true}

# 파일 저장 — 첨부파일 업로드 루트.
# 컨테이너 배포에서는 반드시 호스트 볼륨이 마운트된 경로여야 한다(Jenkinsfile 이 -v 로 마운트하고
# FILE_ROOT_PATH=/app/files 를 주입). 미주입 시 기본값 ./uploads 는 컨테이너 쓰기 계층이라
# 재배포(docker rm)마다 업로드 파일이 전부 사라진다 — 로컬 개발 전용 폴백.
desk:
  file:
    upload-dir: ${FILE_ROOT_PATH:./uploads}

# Swagger 설정
springdoc:
  # 스펙 경로는 /api 네임스페이스 밖에 둔다(springdoc 기본값이자 sso·hr 이 쓰는 경로).
  # 리버스 프록시는 백엔드를 접두사로 고른다 — nginx 의 `location ~ ^/(api|...)` 는
  # 경계가 없어 /api-docs 도 함께 잡아 백엔드로 넘긴다. 그래서 /api-docs 에 두면
  # 전체 API 스펙(엔드포인트·파라미터·DTO 필드명)이 미인증으로 밖에 나간다.
  api-docs:
    path: /v3/api-docs
    enabled: ${SWAGGER_ENABLED:false}
  swagger-ui:
    path: /swagger-ui/index.html
    enabled: ${SWAGGER_ENABLED:false}
    tags-sorter: alpha
    operations-sorter: alpha

# Prometheus 설정
management:
  endpoints:
    web:
      exposure:
        include: prometheus, health, info
  # info 엔드포인트에서 info.* 프로퍼티(APP_VERSION 등)를 노출하려면 필요
  info:
    env:
      enabled: true
  metrics:
    tags:
      application: porest-desk

# 배포 버전 (Jenkins 가 git describe 결과를 APP_VERSION 으로 주입)
# 확인: GET /actuator/info
info:
  app:
    version: ${APP_VERSION:unknown}
