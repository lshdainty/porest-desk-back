spring:
  application:
    name: porest-desk-test
  messages:
    basename: message/core-messages,message/messages
    encoding: utf-8

  # 테스트 DB — H2 인메모리(MariaDB 호환 모드), 엔티티 기반 스키마 자동 생성.
  datasource:
    driver-class-name: org.h2.Driver
    url: jdbc:h2:mem:desk_test;MODE=MariaDB;DB_CLOSE_DELAY=-1;DB_CLOSE_ON_EXIT=FALSE
    username: sa
    password:

  # Redis — 전체 컨텍스트 기동 테스트에서 프로퍼티 바인딩만 통과시키기 위한 더미.
  # 빈 생성 시점에는 접속하지 않으므로 실제 서버가 없어도 된다.
  data:
    redis:
      host: localhost
      port: 6379
      password:
      # application.yml 의 ${REDIS_DATABASE} 는 기본값이 없다(값이 빠지면 기동에서 죽는 게 맞다).
      # 테스트는 환경변수를 받지 않으므로 여기서 못 박는다 — 접속하지 않으니 번호는 아무 뜻이 없다.
      database: 0

  # JPA — 테스트마다 스키마 create-drop, H2 dialect.
  jpa:
    hibernate:
      ddl-auto: create-drop
    properties:
      hibernate:
        dialect: org.hibernate.dialect.H2Dialect
        default_batch_fetch_size: 100
        format_sql: false
    open-in-view: false

# 더미 시크릿 — @WebMvcTest 가 보안 빈을 로드할 때 필요(실제 검증은 @WithLoginUser 로 우회).
jwt:
  secret: test-jwt-secret-test-jwt-secret-test-jwt-secret-0123456789
  access-token-expiration: 3600000
  sso-secret: test-sso-secret-test-sso-secret-test-sso-secret-0123456789
  # SSO JWKS — 기동 시 받아오지 않는다(첫 SSO 토큰 검증 때 조회).
  sso-jwks-uri: http://localhost:0/.well-known/jwks.json

app:
  securities:
    # 테스트는 Redis 를 띄우지 않는다 — 토큰 캐시를 프로세스 메모리로 고정한다.
    token-store: memory
  session-revocation:
    # 같은 이유 — 로그아웃 폐기 표식도 프로세스 메모리로 고정한다.
    store: memory
  session-events:
    # 같은 이유로 SSO 세션 이벤트 구독도 끈다. 리스너 컨테이너는 시작할 때 Redis 에
    # 못 붙으면 애플리케이션 자체를 못 뜨게 한다(컨텍스트 로드 실패).
    # 구독 동작은 SsoSessionEventSubscriberTest 가 직접 건다.
    enabled: false
  sso:
    base-url: http://localhost:0
  cors:
    allowed-origins: http://localhost:3000

# springdoc — 운영 기본값은 false 다(SWAGGER_ENABLED 미설정 시 꺼짐). OpenApi*Test 는
# /v3/api-docs 를 실제로 받아 스펙을 검증하므로 테스트 프로파일에서만 켠다.
springdoc:
  api-docs:
    enabled: true
  swagger-ui:
    enabled: true

logging:
  level:
    com.porest.desk: warn
    org.hibernate.SQL: warn
    p6spy: off
    root: warn

# p6spy — 테스트에서도 끈다. 예전엔 spring.datasource.p6spy 에 적혀 있어 효과가 없었고
# 위 logging.level.p6spy: off 만으로 조용했다. 그 줄은 이중 방어로 남겨 둔다.
decorator:
  datasource:
    p6spy:
      enable-logging: false
