name: CI

on:
  pull_request:
    branches: [ main, master ]
  push:
    branches: [ main, master ]
  # 손으로 돌릴 수 있게 열어 둔다. 머지했는데 실행이 안 잡히는 일이 실제로 있었고
  # (2026-08-07 Actions 장애 — push 이벤트가 통째로 유실됐다) 그때 다시 굴릴 방법이
  # 없었다. 배포만 다시 태우고 싶을 때도 쓴다.
  workflow_dispatch:

permissions:
  contents: write
  checks: write
  pull-requests: write

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout Branch
        uses: actions/checkout@v4

      - name: Set up JDK 25
        uses: actions/setup-java@v4
        with:
          java-version: '25'
          distribution: 'temurin'

      - name: Grant execute permission for gradlew
        run: chmod +x gradlew

      - name: Setup Gradle
        uses: gradle/actions/setup-gradle@v4
        with:
          cache-read-only: ${{ github.ref != 'refs/heads/main' }}

      - name: Test with Gradle
        run: ./gradlew --info test
        env:
          GITHUB_ACTOR: ${{ github.actor }}
          GITHUB_TOKEN: ${{ secrets.READ_PACKAGE_TOKEN }}

      - name: Publish Test Results
        uses: EnricoMi/publish-unit-test-result-action@v2
        if: always()
        with:
          files: 'build/test-results/**/*.xml'

      - name: If the test fails, register a check comment in the failed code line
        uses: mikepenz/action-junit-report@v4
        if: always()
        with:
          report_paths: 'build/test-results/**/*.xml'
          token: ${{ github.token }}

      - name: Upload coverage reports to Codecov
        uses: codecov/codecov-action@v5
        with:
          token: ${{ secrets.CODECOV_TOKEN }}
          files: ./build/reports/jacoco/test/jacocoTestReport.xml

  trigger-deploy:
    needs: test
    # PR 만 빼면 된다. `== 'push'` 로 못 박으면 수동 실행이 테스트만 하고 끝나
    # 정작 필요한 배포를 건너뛴다.
    if: github.ref == 'refs/heads/main' && github.event_name != 'pull_request'
    runs-on: ubuntu-latest
    steps:
      - name: Trigger Jenkins Deploy
        env:
          JENKINS_URL: ${{ secrets.JENKINS_URL }}
        run: |
          set -euo pipefail
          # 시크릿에 줄바꿈이나 공백이 딸려 오면 curl 이 URL 을 못 읽는다(exit 3).
          # 값이 마스킹돼 로그로는 안 보이니 여기서 털어 낸다.
          BASE="$(printf '%s' "${JENKINS_URL}" | tr -d '[:space:]')"
          BASE="${BASE%/}"
          case "${BASE}" in
            http://*|https://*) ;;
            "") echo "::error::JENKINS_URL 이 비어 있습니다."; exit 1 ;;
            *) echo "::error::JENKINS_URL 은 http:// 또는 https:// 로 시작해야 합니다."; exit 1 ;;
          esac
          # -f 가 없으면 404·500 에도 curl 이 0 을 돌려준다. 토큰을 틀리게 적어도
          # 초록불이 뜨고 배포는 안 되는 상태가 되므로, HTTP 오류를 실패로 받는다.
          curl -fsS -X POST "${BASE}/generic-webhook-trigger/invoke?token=porest-desk-back-deploy"
