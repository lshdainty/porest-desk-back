name: Release

# 태그를 밀면 그 태그로 GitHub Release 를 만든다.
#
# 배포 자체는 Jenkins 가 태그로 소스를 받아 서버에서 빌드하므로 릴리스에 붙일 파일은
# 없다. 릴리스는 "이 버전에 뭐가 들어갔나" 를 남기는 용도다 — 노트는 그 사이 머지된
# PR 제목으로 GitHub 이 자동으로 채운다.
on:
  push:
    tags: [ 'v*' ]

permissions:
  contents: write

jobs:
  release:
    runs-on: ubuntu-latest
    env:
      GH_TOKEN: ${{ github.token }}
      GH_REPO: ${{ github.repository }}
    steps:
      # 체크아웃하지 않는다 — gh 가 GH_REPO 로 원격을 직접 다룬다.
      - name: Create release
        run: |
          set -euo pipefail
          # 재실행 대비. 이미 있으면 덮어쓰지 않는다.
          if gh release view "${GITHUB_REF_NAME}" >/dev/null 2>&1; then
            echo "::notice::릴리스 ${GITHUB_REF_NAME} 가 이미 있어 건너뜁니다."
            exit 0
          fi
          gh release create "${GITHUB_REF_NAME}" \
            --title "${GITHUB_REF_NAME}" \
            --generate-notes \
            --verify-tag
